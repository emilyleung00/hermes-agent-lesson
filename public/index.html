<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Todo</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --text:#101114; --muted:#6b7280;
    --border:#e5e7eb; --border-strong:#d1d5db;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --ok:#10b981; --danger:#e11d48; --danger-soft:#fff1f2;
    --shadow:0 1px 2px rgba(16,17,20,.04),0 8px 24px -8px rgba(16,17,20,.10);
    --radius:14px; --radius-sm:9px;
    --ring:0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
           "PingFang TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0c0f; --panel:#15171c; --text:#f2f3f5; --muted:#9aa1ac;
      --border:#262a31; --border-strong:#343a43;
      --accent:#818cf8; --accent-soft:#1d2033;
      --ok:#34d399; --danger:#fb7185; --danger-soft:#2a161c;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,4vw,56px) clamp(12px,4vw,24px);
  }

  .app{width:100%; max-width:620px}

  /* ── Header ─────────────────────────────────────────── */
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px}
  h1{margin:0; font-size:clamp(22px,4.5vw,27px); font-weight:650; letter-spacing:-.02em}
  #count{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap}

  /* ── Add form ───────────────────────────────────────── */
  .composer{display:flex; gap:9px; margin-bottom:14px}
  #new-todo{
    flex:1; min-width:0; padding:13px 15px; font:inherit; color:var(--text);
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-sm);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  #new-todo::placeholder{color:var(--muted)}
  #new-todo:focus{border-color:var(--accent); box-shadow:var(--ring)}
  .btn{
    font:inherit; font-weight:550; cursor:pointer; border-radius:var(--radius-sm);
    border:1px solid var(--border-strong); background:var(--panel); color:var(--text);
    padding:0 17px; transition:background .15s,border-color .15s,transform .06s;
  }
  .btn:hover{background:var(--accent-soft); border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none; box-shadow:var(--ring)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn-primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000); border-color:transparent}

  /* ── Filters ────────────────────────────────────────── */
  .toolbar{display:flex; align-items:center; gap:6px; margin-bottom:12px}
  .segmented{
    display:inline-flex; gap:2px; padding:3px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px;
  }
  .segmented button{
    font:inherit; font-size:13px; cursor:pointer; border:0; background:none; color:var(--muted);
    padding:6px 13px; border-radius:7px; transition:background .15s,color .15s;
  }
  .segmented button:hover{color:var(--text)}
  .segmented button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .segmented button:focus-visible{outline:none; box-shadow:var(--ring)}
  .toolbar .spacer{flex:1}
  .link{
    font:inherit; font-size:13px; cursor:pointer; border:0; background:none;
    color:var(--muted); padding:6px 8px; border-radius:7px; transition:color .15s,background .15s;
  }
  .link:hover{color:var(--danger); background:var(--danger-soft)}
  .link:focus-visible{outline:none; box-shadow:var(--ring)}

  /* ── List ───────────────────────────────────────────── */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  ul{list-style:none; margin:0; padding:0}
  li{
    display:flex; align-items:flex-start; gap:11px; padding:12px 14px;
    border-bottom:1px solid var(--border); animation:enter .18s ease-out;
  }
  li:last-child{border-bottom:0}
  @keyframes enter{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ li{animation:none} *{transition:none!important} }

  /* checkbox */
  .check{
    flex:none; width:20px; height:20px; margin-top:1px; cursor:pointer;
    appearance:none; border:1.8px solid var(--border-strong); border-radius:6px;
    background:transparent; display:grid; place-content:center;
    transition:background .15s,border-color .15s;
  }
  .check:hover{border-color:var(--accent)}
  .check:checked{background:var(--accent); border-color:var(--accent)}
  .check:checked::after{
    content:""; width:5px; height:9px; margin-top:-2px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .check:focus-visible{outline:none; box-shadow:var(--ring)}

  .label{flex:1; min-width:0; word-break:break-word; cursor:pointer; transition:color .15s}
  li.done .label{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px}

  .del{
    flex:none; width:30px; height:30px; display:grid; place-content:center; cursor:pointer;
    border:0; border-radius:8px; background:none; color:var(--muted); font-size:18px; line-height:1;
    transition:background .15s,color .15s;
  }
  .del:hover{background:var(--danger-soft); color:var(--danger)}
  .del:focus-visible{outline:none; box-shadow:var(--ring)}

  /* ── Empty state ────────────────────────────────────── */
  .empty{padding:44px 20px; text-align:center; color:var(--muted)}
  .empty svg{width:34px; height:34px; margin-bottom:10px; opacity:.7}
  .empty p{margin:0; font-size:14px; color:var(--text); opacity:.75}

  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Todo</h1>
    <span id="count" aria-live="polite"></span>
  </header>

  <form class="composer" id="form" autocomplete="off">
    <label class="sr-only" for="new-todo">新增待辦事項</label>
    <input id="new-todo" type="text" placeholder="需要完成什麼？" maxlength="200" enterkeyhint="done">
    <button class="btn btn-primary" type="submit">新增</button>
  </form>

  <div class="toolbar">
    <div class="segmented" role="group" aria-label="篩選待辦事項">
      <button type="button" data-filter="all"       aria-pressed="true">全部</button>
      <button type="button" data-filter="active"    aria-pressed="false">未完成</button>
      <button type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>
    <span class="spacer"></span>
    <button class="link" type="button" id="clear-done" hidden>清除已完成</button>
  </div>

  <div class="card">
    <ul id="list" aria-label="待辦事項清單"></ul>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      <p id="empty-msg">還沒有任何待辦事項</p>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  const STORE_KEY = "todo.items.v1";
  const FILTER_KEY = "todo.filter.v1";

  const $form   = document.getElementById("form");
  const $input  = document.getElementById("new-todo");
  const $list   = document.getElementById("list");
  const $count  = document.getElementById("count");
  const $empty  = document.getElementById("empty");
  const $emptyMsg = document.getElementById("empty-msg");
  const $clear  = document.getElementById("clear-done");
  const $filters = [...document.querySelectorAll("[data-filter]")];

  /** @type {{id:string,text:string,done:boolean,createdAt:number}[]} */
  let items = [];
  let filter = "all";

  /* ── Persistence ─────────────────────────────────────── */
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      items = Array.isArray(parsed)
        ? parsed.filter(o => o && typeof o.text === "string" && o.text.trim())
            .map(o => ({
              id: String(o.id ?? uid()),
              text: o.text,
              done: Boolean(o.done),
              createdAt: Number(o.createdAt) || Date.now()
            }))
        : [];
      if (parsed && !Array.isArray(parsed)) save();   // heal corrupt shape
    } catch {
      items = [];                                     // unreadable → start clean
    }
    const savedFilter = localStorage.getItem(FILTER_KEY);
    if (["all", "active", "completed"].includes(savedFilter)) filter = savedFilter;
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
    } catch (err) {
      console.warn("無法寫入 localStorage", err);
    }
  }

  function uid() {
    return crypto.randomUUID ? crypto.randomUUID()
                             : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ── Render ──────────────────────────────────────────── */
  const visible = () => items.filter(it =>
    filter === "active" ? !it.done :
    filter === "completed" ? it.done : true);

  function render() {
    const rows = visible();
    $list.replaceChildren(...rows.map(makeRow));

    const left = items.filter(it => !it.done).length;
    $count.textContent = items.length
      ? `${left} 項未完成 / 共 ${items.length} 項`
      : "";

    $clear.hidden = !items.some(it => it.done);

    $filters.forEach(btn => {
      btn.setAttribute("aria-pressed", String(btn.dataset.filter === filter));
    });

    const isEmpty = rows.length === 0;
    $empty.hidden = !isEmpty;
    if (isEmpty) {
      $emptyMsg.textContent =
        items.length === 0   ? "還沒有任何待辦事項" :
        filter === "active"  ? "沒有未完成的事項 🎉" :
        filter === "completed" ? "還沒有完成任何事項" : "";
    }
  }

  function makeRow(it) {
    const li = document.createElement("li");
    li.dataset.id = it.id;
    if (it.done) li.classList.add("done");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "check";
    cb.checked = it.done;
    cb.setAttribute("aria-label", (it.done ? "標記為未完成：" : "標記為已完成：") + it.text);
    cb.addEventListener("change", () => toggle(it.id));

    // textContent (never innerHTML) → user input cannot inject markup
    const span = document.createElement("span");
    span.className = "label";
    span.textContent = it.text;
    span.title = "點擊切換狀態";
    span.addEventListener("click", () => toggle(it.id));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "刪除：" + it.text);
    del.addEventListener("click", () => remove(it.id));

    li.append(cb, span, del);
    return li;
  }

  /* ── Actions ─────────────────────────────────────────── */
  function add(text) {
    const t = text.trim().replace(/\s+/g, " ");
    if (!t) return;
    items.push({ id: uid(), text: t.slice(0, 200), done: false, createdAt: Date.now() });
    save(); render();
  }

  function toggle(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    it.done = !it.done;
    save();
    render();
    // keep focus usable after re-render
    const row = $list.querySelector(`li[data-id="${CSS.escape(id)}"] .check`);
    if (row) row.focus({ preventScroll: true });
  }

  function remove(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx === -1) return;
    items.splice(idx, 1);
    save(); render();
    $input.focus();
  }

  function setFilter(next) {
    filter = next;
    try { localStorage.setItem(FILTER_KEY, next); } catch {}
    render();
  }

  /* ── Wiring ──────────────────────────────────────────── */
  $form.addEventListener("submit", e => {
    e.preventDefault();
    add($input.value);
    $input.value = "";
    $input.focus();
  });

  $filters.forEach(btn =>
    btn.addEventListener("click", () => setFilter(btn.dataset.filter)));

  $clear.addEventListener("click", () => {
    if (!items.some(it => it.done)) return;
    items = items.filter(it => !it.done);
    save(); render();
  });

  // keep multiple tabs in sync
  addEventListener("storage", e => {
    if (e.key === STORE_KEY) { load(); render(); }
  });

  load();
  render();
  $input.focus();

  // expose a tiny handle for automated checks
  window.__todo = {
    get items() { return items; },
    get filter() { return filter; },
    add, toggle, remove, setFilter
  };
})();
</script>
</body>
</html>
